[package]
name = "pmc-io"
description = "Async PDF and metadata ingestion for PMC Arrow through OpenDAL and byte streams"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository = "https://github.com/dentiny/pub-medical-arrow-rs"

[dependencies]
pmc-arrow.workspace = true
opendal.workspace = true
futures.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true

[dev-dependencies]
arrow-array.workspace = true
tempfile.workspace = true
opendal = { workspace = true, features = ["services-fs"] }
tokio = { workspace = true, features = ["macros", "rt", "fs", "io-std", "io-util"] }
