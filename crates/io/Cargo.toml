[package]
name = "pmc-io"
description = "Async PDF ingestion for PMC Arrow through OpenDAL and byte streams"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[dependencies]
pmc-arrow.workspace = true
opendal.workspace = true
futures.workspace = true
thiserror.workspace = true

[dev-dependencies]
arrow-array.workspace = true
opendal = { workspace = true, features = ["services-fs"] }
tokio = { workspace = true, features = ["macros", "rt", "fs", "io-std", "io-util"] }
