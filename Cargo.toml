[workspace]
members = ["crates/rs", "crates/io", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
arrow-array = "58"
arrow-schema = "58"
arrow-ipc = "58"
opendal = { version = "0.59.3", default-features = false, features = [
    "executors-tokio",
    "http-transport-reqwest",
] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = "1"
pmc-arrow = { path = "crates/rs", version = "0.1.0" }
pmc-io = { path = "crates/io", version = "0.1.0" }
